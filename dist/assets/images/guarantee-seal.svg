<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="50%" stop-color="#ffa751"/>
      <stop offset="100%" stop-color="#d48800"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2677c8"/>
      <stop offset="100%" stop-color="#0f457c"/>
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Ribbons -->
  <path d="M60 150 L40 195 L75 180 L90 195 L80 150 Z" fill="#b87b00" opacity="0.9"/>
  <path d="M140 150 L160 195 L125 180 L110 195 L120 150 Z" fill="#b87b00" opacity="0.9"/>
  <!-- Outer Starburst/Seal -->
  <circle cx="100" cy="95" r="78" fill="url(#goldGrad)" filter="url(#sealShadow)"/>
  <circle cx="100" cy="95" r="68" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="95" r="64" fill="url(#innerGrad)"/>
  <!-- Text Elements -->
  <text x="100" y="65" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" fill="#ffd700" text-anchor="middle" letter-spacing="1">100% MONEY BACK</text>
  <text x="100" y="105" font-family="'Roboto Condensed', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">60</text>
  <text x="100" y="122" font-family="'Roboto Condensed', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">DAYS</text>
  <text x="100" y="140" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#ffd700" text-anchor="middle">GUARANTEE</text>
  <!-- Stars -->
  <g fill="#ffd700" transform="translate(100, 153) scale(0.6)">
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.5,7 0,3.5 -5.5,7 -3.6,1.5 -8,-2.5 -2.4,-2.5" transform="translate(-32, 0)"/>
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.5,7 0,3.5 -5.5,7 -3.6,1.5 -8,-2.5 -2.4,-2.5" transform="translate(-16, 0)"/>
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.5,7 0,3.5 -5.5,7 -3.6,1.5 -8,-2.5 -2.4,-2.5" transform="translate(0, 0)"/>
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.5,7 0,3.5 -5.5,7 -3.6,1.5 -8,-2.5 -2.4,-2.5" transform="translate(16, 0)"/>
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.5,7 0,3.5 -5.5,7 -3.6,1.5 -8,-2.5 -2.4,-2.5" transform="translate(32, 0)"/>
