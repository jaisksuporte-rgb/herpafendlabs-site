  <defs>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Back Row (3 bottles) -->
  <g transform="translate(40, 10) scale(0.82)">
    <!-- Bottle Shadow -->
    <ellipse cx="60" cy="188" rx="42" ry="10" fill="#000000" opacity="0.18"/>
    <!-- Bottle Body (White/Amber Medical Container) -->
    <rect x="25" y="48" width="70" height="136" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="23" y="164" width="74" height="18" rx="8" fill="#e2e8f0"/>
    <!-- Bottle Neck & Cap -->
    <rect x="42" y="30" width="36" height="20" rx="3" fill="#cbd5e1"/>
    <rect x="38" y="14" width="44" height="22" rx="4" fill="#1e745e" stroke="#0f457c" stroke-width="1"/>
    <!-- Ribbed Cap Details -->
    <line x1="44" y1="14" x2="44" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="52" y1="14" x2="52" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="14" x2="60" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="68" y1="14" x2="68" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="76" y1="14" x2="76" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <!-- Bottle Label -->
    <rect x="27" y="62" width="66" height="98" rx="6" fill="#2677c8"/>
    <rect x="27" y="62" width="66" height="22" fill="#0f457c"/>
    <!-- Gold / Shield emblem on label -->
    <circle cx="60" cy="73" r="7" fill="#ffd700"/>
    <path d="M57 73 L60 70 L63 73 L60 76 Z" fill="#0f457c"/>
    <!-- Brand Label Text -->
    <text x="60" y="96" font-family="'Roboto Condensed', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HERPAFEND</text>
    <text x="60" y="106" font-family="'Montserrat', sans-serif" font-size="6" font-weight="700" fill="#93c5fd" text-anchor="middle">VIRAL BIOSHIELD</text>
    <rect x="33" y="112" width="54" height="12" rx="3" fill="#ffffff"/>
    <text x="60" y="121" font-family="'Montserrat', sans-serif" font-size="7" font-weight="900" fill="#1e745e" text-anchor="middle">DEFENSE COMPLEX</text>
    <!-- Dosage pill detail -->
