<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" width="360" height="48">
  <rect width="360" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- VISA -->
  <g transform="translate(15, 12)">
    <rect width="50" height="24" rx="4" fill="#1a1f71"/>
    <text x="25" y="17" font-family="'Montserrat', sans-serif" font-size="12" font-style="italic" font-weight="900" fill="#ffffff" text-anchor="middle">VISA</text>
  </g>
  <!-- MASTERCARD -->
  <g transform="translate(75, 12)">
    <rect width="50" height="24" rx="4" fill="#2d3748"/>
    <circle cx="20" cy="12" r="8" fill="#eb001b"/>
    <circle cx="30" cy="12" r="8" fill="#f79e1b" fill-opacity="0.85"/>
  </g>
  <!-- AMEX -->
  <g transform="translate(135, 12)">
    <rect width="50" height="24" rx="4" fill="#006fcf"/>
    <text x="25" y="16" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">AMEX</text>
  </g>
  <!-- DISCOVER -->
  <g transform="translate(195, 12)">
    <rect width="50" height="24" rx="4" fill="#ff6000"/>
    <text x="25" y="16" font-family="'Montserrat', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">DISCOVER</text>
  </g>
  <!-- 256-bit SSL -->
  <g transform="translate(255, 12)">
    <rect width="90" height="24" rx="4" fill="#059669"/>
    <!-- Lock Icon -->
    <path d="M12 9 V7 A4 4 0 0 1 20 7 V9 M10 9 H22 V18 H10 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" transform="scale(0.8) translate(3, 1)"/>
    <text x="56" y="16" font-family="'Montserrat', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">256-BIT SSL</text>
  </g>
</svg>