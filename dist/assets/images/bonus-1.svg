<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="220" height="280">
  <defs>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bookCover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e745e"/>
      <stop offset="100%" stop-color="#0d3f32"/>
    </linearGradient>
  </defs>
  <!-- Book spine & body -->
  <path d="M25 20 L40 10 L195 10 L180 20 Z" fill="#cbd5e1"/>
  <rect x="25" y="20" width="16" height="240" fill="#0d3f32"/>
  <rect x="41" y="20" width="154" height="240" rx="3" fill="url(#bookCover1)" filter="url(#bookShadow)"/>
  <!-- Decorative header -->
  <rect x="41" y="35" width="154" height="6" fill="#ffd700"/>
  <text x="118" y="65" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#ffd700" text-anchor="middle" letter-spacing="1">SPECIAL DIGITAL GUIDE</text>
  <!-- Main Title -->
  <text x="118" y="105" font-family="'Roboto Condensed', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">BOOSTING YOUR</text>
  <text x="118" y="130" font-family="'Roboto Condensed', sans-serif" font-size="22" font-weight="900" fill="#ffd700" text-anchor="middle">IMMUNE SYSTEM</text>
  <text x="118" y="155" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">THE NATURAL WAY</text>
  <!-- Icon / Emblem -->
  <circle cx="118" cy="195" r="22" fill="#ffffff" opacity="0.15"/>
  <path d="M118 180 L132 188 C132 204 118 214 118 214 C118 214 104 204 104 188 Z" fill="#ffd700"/>
  <!-- Free value badge -->
  <rect x="65" y="235" width="106" height="18" rx="9" fill="#ffd700"/>
  <text x="118" y="248" font-family="'Roboto Condensed', sans-serif" font-size="11" font-weight="900" fill="#1e293b" text-anchor="middle">VALUE: $125 • FREE</text>
